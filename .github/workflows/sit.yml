# Mete sit la ajou otomatikman sou GitHub Pages.
# Li kouri chak jou a 06:17 ak 18:17 UTC, chak fwa w push sou main,
# epi lè w klike "Run workflow" nan onglet Actions la.
name: Mete sit la ajou

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 18 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Telechaje done yo
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python3 scripts/fetch_data.py

      - name: Teste modèl la sou match ki deja jwe (backtest)
        run: python3 scripts/backtest.py

      - name: Analize match yo epi konstwi sit la
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python3 scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
