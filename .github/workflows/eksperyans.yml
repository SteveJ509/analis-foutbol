name: Eksperyans (pa pibliye anyen)
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 scripts/fetch_data.py
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - run: python3 scripts/backtest.py
      - run: python3 scripts/combo.py --json && echo "=====JSON=====" && cat data/combo_auto.json
